debug: true

spring:
  application:
    name: equipment-rental

  datasource:
    url: jdbc:postgresql://localhost:5432/equipment_rental
    username: myuser
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    check-location: false
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ToJestBardzoTajnyKluczDoJWTKtoryMaMinimum32Znaki!

logging:
  level:
    org.flywaydb: DEBUG
