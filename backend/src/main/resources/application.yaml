debug: true

spring:
  application:
    name: equipment-rental

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equipment_rental}
    username: ${SPRING_DATASOURCE_USERNAME:rental}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    check-location: false
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:ToJestBardzoTajnyKluczDoJWTKtoryMaMinimum32Znaki!}

logging:
  level:
    org.flywaydb: DEBUG