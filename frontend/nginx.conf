server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: każdy nieznaleziony URL (np. /home/rentals po odświeżeniu strony)
    # ma wracać do index.html, żeby React Router mógł go obsłużyć.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Wszystko co idzie na /api/... jest przekierowywane do kontenera backendu.
    # "backend" to nazwa serwisu z docker-compose.yml — Docker sam je
    # rozwiązuje po nazwie w wewnętrznej sieci, bez podawania adresu IP.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://backend:8080/v3/api-docs/;
        proxy_set_header Host $host;
    }
}
